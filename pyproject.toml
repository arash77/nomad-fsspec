[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "nomad-fsspec"
version = "0.1.0"
description = "An fsspec filesystem for the public raw data of NOMAD."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "nomad-fsspec contributors" }]
keywords = ["nomad", "fsspec", "materials science", "filesystem"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "fsspec>=2024.1.0",
    "requests>=2.31",
    "urllib3>=1.26",
]

[project.entry-points."fsspec.specs"]
nomad = "nomad_fsspec:NomadFileSystem"

[project.urls]
Homepage = "https://github.com/arash77/nomad-fsspec"
Issues = "https://github.com/arash77/nomad-fsspec/issues"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "responses>=0.25",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-requests",
]

[tool.hatch.build.targets.wheel]
packages = ["src/nomad_fsspec"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "C4", "SIM"]

[tool.mypy]
python_version = "3.10"
warn_unused_ignores = true
ignore_missing_imports = true
files = ["src/nomad_fsspec"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = ["live: tests that call the public NOMAD at nomad-lab.eu"]
